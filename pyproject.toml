[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vespa"
version = "1.0.0"
description = "VESPA: Verifiable Symbolic Policy Adaptation for Safe Reinforcement Learning"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Paul König" },
  { name = "Sascha Marton" },
  { name = "Stefan Lüdtke" },
  { name = "Christian Bartelt" },
]
# Pinned dependencies live in environment/ (the paper results depend on exact versions).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
